[package]
name = "tzslim"
version = "0.1.0"
edition = "2024"
description = "Generate compact per-zone NDJSON timezone files"

[features]
# Compile a tz database into the binary so `--tzdata-bundled` works offline.
# The data is frozen at the jiff-tzdb release; `cargo update` to refresh it.
tzdata-bundled = ["jiff/tzdb-bundle-always", "dep:jiff-tzdb"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
getrandom = "0.3"
# No bundled database: jiff reads TZif files from a directory at runtime.
jiff-tzdb = { version = "0.1", optional = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# native-certs: trust the OS certificate store (works behind corporate proxies)
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
