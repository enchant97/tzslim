[package]
name = "tzslim"
version = "0.1.0"
edition = "2024"
description = "Generate compact per-zone NDJSON timezone files"

[features]
# Compile a tz database into the binary so `--tzdata-bundled` works offline.
# The data is frozen at the jiff-tzdb release; `cargo update` to refresh it.
tzdata-bundled = ["jiff/tzdb-bundle-always", "dep:jiff-tzdb"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "3"
getrandom = "0.4"
# No bundled database: jiff reads TZif files from a directory at runtime.
jiff-tzdb = { version = "1", optional = true }
jiff = { version = "1", default-features = false, features = ["std", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_with = { version = "3.25.0", features = ["base64"] }
hex = "0.4.3"

[profile.release]
lto = true
strip = true
